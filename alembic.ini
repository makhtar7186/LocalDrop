# Configuration Alembic pour la ligne de commande (développement).
# À l'exécution, l'application configure Alembic par code (infrastructure/database/migrate.py).
# L'URL de la base est déduite de Settings (LOCALDROP_DATA_DIR) dans migrations/env.py.
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
