[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localdrop"
version = "0.1.0"
description = "Partage de fichiers local entre un PC Windows et un smartphone, sans cloud."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "qrcode>=7.4",
    "psutil>=5.9",
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.7",
]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.3",
    "pytest-qt>=4.4",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-psutil",
]

[tool.setuptools.packages.find]
where = ["backend/src", "apps/desktop/src"]
include = ["localdrop*", "localdrop_desktop*"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "apps/desktop/src"]
extend-exclude = ["apps/web", "migrations/versions", ".claude", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "N", "PTH", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests : assert autorisé ; IDs d'exigence en majuscules dans les noms (test_FR_026_...).
"**/tests/**" = ["S101", "S105", "S106", "N802"]
"tests/**" = ["S101", "S105", "S106", "N802"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["backend/src", "apps/desktop/src"]
packages = ["localdrop", "localdrop_desktop"]

[[tool.mypy.overrides]]
module = ["qrcode", "qrcode.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests", "apps/desktop/tests", "tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "-ra"]
timeout = 30  # filet de sécurité : un WebSocket qui n'arrive jamais ne bloque pas la suite
markers = [
    "unit: tests rapides sans I/O",
    "integration: tests avec l'application, la base et le disque",
    "e2e: tests de bout en bout (manuels ou semi-automatisés)",
]
